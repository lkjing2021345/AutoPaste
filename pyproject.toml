[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaste"
description = "把文本敲进当前聚焦的窗口：X11 XTEST / Wayland wtype/ydotool，零第三方依赖"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "lkjing2021345" },
]
keywords = ["x11", "xtest", "wayland", "wtype", "ydotool", "keyboard-injection",
            "keyboard", "automation", "paste"]
# 版本号的唯一来源是 autopaste.py 里的 __version__，见 [tool.setuptools.dynamic]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lkjing2021345/AutoPaste"
Source = "https://github.com/lkjing2021345/AutoPaste"

[project.scripts]
autopaste = "autopaste:console_main"

[tool.setuptools]
py-modules = ["autopaste"]

[tool.setuptools.dynamic]
version = { attr = "autopaste.__version__" }
