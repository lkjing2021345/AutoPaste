name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法检查
        run: python -m py_compile autopaste.py
      - name: 命令行可用性（不触碰 X11）
        run: |
          python autopaste.py --version
          python autopaste.py --help > /dev/null
      - name: 校验文档中引用的文件都存在
        run: |
          for f in LICENSE README.md README.en.md SECURITY.md CHANGELOG.md \
                   install.sh pyproject.toml; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
      - name: 校验 tests/ 存在测试
        run: test -n "$(ls tests/test_*.py)"

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 单元测试（无需 DISPLAY，假后端）
        run: env -u DISPLAY python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 打包并安装（验证 pyproject / console_scripts）
        run: |
          python -m pip install --no-deps .
          autopaste --version
